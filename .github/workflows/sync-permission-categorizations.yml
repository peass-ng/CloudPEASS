name: Sync HackTricks permission categorizations
on:
  schedule:
    - cron: '29 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-permission-categorizations
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: HackTricks-wiki/hacktricks-cloud
          ref: master
          path: .canonical-source
          sparse-checkout: src/permission-categorizations
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install offline validation dependencies
        run: python -m pip install PyYAML requests pytest
      - name: Synchronize and verify canonical permissions
        run: |
          python scripts/sync_hacktricks_permissions.py --book-root .canonical-source
          python scripts/sync_hacktricks_permissions.py --book-root .canonical-source --check
          python -m pytest -q tests/test_canonical_permissions.py
      - name: Commit changed copies
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add src/CloudPEASS/risk_rules src/sensitive_permissions
          if git diff --cached --quiet; then
            echo 'Canonical permission hashes are unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync canonical permission categorizations from HackTricks Cloud'
          git push origin "HEAD:$DEFAULT_BRANCH"
