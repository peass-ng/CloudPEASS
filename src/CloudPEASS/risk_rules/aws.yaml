## =====================
## EVIDENCE-BACKED DOWNGRADES
## =====================

## Exact actions that are only medium in isolation. Their documented companion
## permissions can still form high-impact combinations.
medium_override_exact:
  # Registry authorization tokens carry only the caller's existing ECR/ECR
  # Public authorization. Live pull/push paths still needed the corresponding
  # repository actions; token retrieval alone exposed no image or workload.
  - ecr:GetAuthorizationToken
  - ecr-public:GetAuthorizationToken
  # Hosted MCP actions only gate tool discovery/invocation. Live calls were
  # delegated as the caller and still enforced every underlying ECS/EKS/IAM
  # or Kubernetes permission; public knowledge tools expose no account data.
  - ecs-mcp:InvokeReadOnlyTools
  - ecs-mcp:UseMcp
  - eks-mcp:CallPrivilegedTool
  - eks-mcp:CallReadOnlyTool
  - eks-mcp:InvokeMcp
  # These EFS actions do not authorize a mount by themselves. Live tests
  # required ClientMount for write/root/POSIX access-point effects; the network
  # operations have separate documented EC2 dependencies and still need client access.
  - elasticfilesystem:ClientRootAccess
  - elasticfilesystem:ClientWrite
  - elasticfilesystem:CreateAccessPoint
  - elasticfilesystem:CreateMountTarget
  - elasticfilesystem:ModifyMountTargetSecurityGroups
  # PutMedia can inject media into a known active feed, and UpdateDictionary
  # can replace a known vocabulary. They affect integrity but do not expose
  # generated metadata or dictionary entries without separate read actions.
  - elemental-inference:PutMedia
  - elemental-inference:UpdateDictionary
  # Modify can alter rows, but every standard Keyspaces driver also needs
  # cassandra:Select on the read-only system* resources to authenticate.
  # That tested pair is High; Modify alone is not usable through the CQL API.
  - cassandra:Modify
  # The caller also needs iam:PassRole, a capable restore role, and access to
  # the restored target before this becomes a sensitive-data path.
  - backup:StartRestoreJob
  # These become a critical launch-role escalation only as a pair, and only
  # when the caller controls a product artifact associated with a privileged
  # launch constraint. Neither action is independently a privilege grant.
  - servicecatalog:CreateProvisioningArtifact
  - servicecatalog:ProvisionProduct
  # A recipe must track a wildcard version of the attacker-writable component,
  # and its existing pipeline instance profile must have useful privileges.
  # The pair is critical; neither action provides that profile by itself.
  - imagebuilder:CreateComponent
  - imagebuilder:StartImagePipelineExecution
  # CreateDeployment enforces the two companion CodeDeploy actions. The chain
  # is critical only when the caller controls a revision and an existing
  # EC2/on-premises group targets a useful instance profile.
  - codedeploy:CreateDeployment
  - codedeploy:RegisterApplicationRevision
  # A trusted target resource policy and controllable event bus/rule are also
  # required. The pair can invoke privileged code; neither action does so alone.
  - events:PutEvents
  - events:PutTargets
  # No supported caller-facing API exposes connection credentials directly.
  - events:RetrieveConnectionCredentials
  # Both operations accept replacement code, but the service performs the
  # update in the caller's context. Live tests required the generated Lambda
  # preparation actions and iam:PassRole before attacker code ran under the
  # existing canary execution role.
  - synthetics:StartCanaryDryRun
  - synthetics:UpdateCanary
  # UpdateExperimentTemplate retained the existing experiment role without a
  # caller iam:PassRole check, but the tested escalation also required
  # StartExperiment and a pre-authorized FIS-to-SSM role chain. Start alone
  # can only execute the template already stored. The pair is Critical.
  - fis:UpdateExperimentTemplate
  - fis:StartExperiment
  # Upload credentials are issued only while a known build is INITIALIZED.
  # A live READY-build request was rejected, so this cannot replace an
  # immutable build or execute code without a later fleet/deployment action.
  - gamelift:RequestUploadCredentials
  # Returns queued/in-progress IoT job execution metadata but never the job
  # document. Live validation kept it below the three document-returning APIs.
  - iotjobsdata:GetPendingJobExecutions
  # Returns stream-key identifiers but never the secret value. It is useful
  # reconnaissance for the separately High Get/BatchGet actions.
  - ivs:ListStreamKeys
  # Returns the complete AMB billing token used instead of SigV4 for public
  # blockchain-node API requests. Live validation showed credential exposure,
  # but the token provides billable public-chain access rather than private
  # tenant data or AWS privilege escalation.
  - managedblockchain:GetAccessor
  # Returns public on-chain transaction data supplied by hash/ID. It is a
  # billable authenticated query, not account-owned sensitive data.
  - managedblockchain-query:GetTransaction

