version: 2
provider: gcp

# Immediate privilege escalation, impersonation, credential disclosure, or
# interactive code execution. Suffix rules also cover newly introduced GCP
# permissions whose service names are not yet known to CloudPEASS.
critical_suffixes:
  - .actas
  - .setiampolicy
  - .getaccesstoken
  - .signblob
  - .signjwt

critical_exact:
  - apikeys.keys.getKeyString
  - appengine.instances.enableDebug
  - cloudbuild.builds.create
  - composer.environments.executeAirflowCommand
